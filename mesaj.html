<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Onur TV Son Dakika</title>
<style>
  :root { --bg: #070b16; --text: #eef1f7; --muted: #8b93a7; --accent: #ffb03b; --pink: #ff4d6d; --green: #34d399; --red: #e5484d; --yellow: #ffd400; --line: rgba(140,170,255,0.14); }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body { background: radial-gradient(600px 500px at 50% 0%, #13224a 0%, var(--bg) 70%); color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  .kap { max-width: 480px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; }
  header svg { width: 42px; height: 42px; flex: none; }
  header .ad { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
  header .ad span { background: linear-gradient(90deg, var(--accent), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rozet { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; background: var(--yellow); color: #1a1400;
    font-size: 13px; font-weight: 800; letter-spacing: 2px; padding: 6px 12px; border-radius: 6px; }
  .rozet i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: yan 1s infinite; }
  @keyframes yan { 50% { opacity: .2; } }
  h1 { font-size: 22px; font-weight: 700; margin-top: 12px; line-height: 1.3; }
  .alt { color: var(--muted); font-size: 15px; margin-top: 6px; line-height: 1.4; }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 1px; margin: 22px 0 8px; }
  textarea, input { width: 100%; font: inherit; font-size: 18px; color: var(--text); background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; outline: none; }
  textarea { min-height: 110px; resize: vertical; line-height: 1.4; }
  textarea:focus, input:focus { border-color: var(--accent); }
  .say { text-align: right; font-size: 13px; color: var(--muted); margin-top: 6px; }

  .hazir { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .hazir button { font: inherit; font-size: 15px; color: var(--text); background: rgba(255,255,255,0.06); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 14px; }
  .hazir button:active { background: rgba(255,176,59,0.2); }

  .zaman { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .zaman button { font: inherit; font-size: 15px; font-weight: 600; color: var(--text); background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 6px; }
  .zaman button.secili { border-color: var(--accent); background: rgba(255,176,59,0.16); color: #ffd28a; }
  .ozel { display: none; align-items: center; gap: 10px; margin-top: 10px; }
  .ozel.acik { display: flex; }
  .ozel input { width: 110px; text-align: center; }
  .ozel span { color: var(--muted); font-size: 15px; }
  #geriSayim { margin-top: 12px; text-align: center; font-size: 15px; color: #ffd28a; font-weight: 600; min-height: 20px; font-variant-numeric: tabular-nums; }
  #gonder { width: 100%; margin-top: 22px; font: inherit; font-size: 19px; font-weight: 800; color: #fff; border: 0; border-radius: 18px;
    padding: 18px; background: linear-gradient(135deg, var(--accent), var(--pink)); box-shadow: 0 14px 40px rgba(255,77,109,.3); }
  #gonder:disabled { opacity: .5; }
  #durum { margin-top: 16px; min-height: 22px; text-align: center; font-size: 15px; color: var(--muted); }
  #durum.ok { color: var(--green); font-weight: 600; }
  #durum.hata { color: var(--pink); }

  .onizleme { margin-top: 26px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #04070e; }
  .onizleme .ust { font-size: 12px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .onizleme .serit { display: flex; align-items: center; height: 46px; }
  .onizleme .canli { flex: none; height: 100%; display: flex; align-items: center; padding: 0 10px; background: var(--yellow); color: #1a1400; font-size: 11px; font-weight: 800; letter-spacing: 1px; }
  .onizleme .metin { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 12px; font-size: 15px; color: #ffe066; font-weight: 700; }
  .onizleme .metin em { font-style: normal; background: var(--red); color: #fff; font-size: 10px; letter-spacing: 1px; padding: 2px 6px; border-radius: 4px; margin-right: 8px; vertical-align: 2px; }
</style>
</head>
<body>
<div class="kap">
  <header>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb03b"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient></defs>
      <path d="M36 14 L50 27 L64 14" fill="none" stroke="url(#t)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8" y="27" width="84" height="58" rx="14" fill="url(#t)"/><rect x="15" y="34" width="70" height="44" rx="8" fill="#0b1022"/>
      <path d="M50 70 C 38 61, 33 55, 33 49 C 33 44, 37 41, 41 41 C 45 41, 48 43, 50 46 C 52 43, 55 41, 59 41 C 63 41, 67 44, 67 49 C 67 55, 62 61, 50 70 Z" fill="#ff4d6d"/>
    </svg>
    <div class="ad">Onur <span>TV</span></div>
  </header>

  <div class="rozet"><i></i>SON DAKİKA</div>
  <h1>Yazdığın, TV'nin alt bandında son dakika olarak geçsin</h1>
  <div class="alt">Mesaj 30 dakika boyunca bantta kalır.</div>

  <label for="metin">MESAJ</label>
  <textarea id="metin" maxlength="160" placeholder="Örn: Yemek hazır, herkes sofraya! 🍽️"></textarea>
  <div class="say"><span id="sayac">0</span> / 160</div>
  <div class="hazir">
    <button data-m="Yemek hazır, herkes sofraya! 🍽️">🍽️ Yemek hazır</button>
    <button data-m="Seni çok seviyorum ❤️">❤️ Seni seviyorum</button>
    <button data-m="Çay demlendi ☕">☕ Çay demlendi</button>
    <button data-m="Maç başlıyor! ⚽">⚽ Maç başlıyor</button>
  </div>

  <label for="kimden">KİMDEN (İSTEĞE BAĞLI)</label>
  <input id="kimden" maxlength="30" placeholder="Örn: Onur">

  <label>NE ZAMAN YAYINLANSIN?</label>
  <div class="zaman" id="zaman">
    <button data-sn="0" class="secili">⚡ Hemen</button>
    <button data-sn="10">10 sn</button>
    <button data-sn="30">30 sn</button>
    <button data-sn="60">1 dk</button>
    <button data-sn="300">5 dk</button>
    <button data-sn="ozel">✏️ Özel</button>
  </div>
  <div class="ozel" id="ozel"><input id="ozelSn" type="number" inputmode="numeric" min="1" max="86400" placeholder="45"><span>saniye sonra</span></div>

  <button id="gonder">📺 TV'ye Gönder</button>
  <div id="geriSayim"></div>
  <div id="durum"></div>

  <div class="onizleme">
    <div class="ust">TV'de böyle görünecek</div>
    <div class="serit"><div class="canli">SON DAKİKA</div><div class="metin" id="onizMetin"><em>SON DAKİKA</em>Mesajın burada görünecek</div></div>
  </div>
</div>

<script src="peerjs.min.js"></script>
<script>
var tvId = decodeURIComponent(location.hash.slice(1));
var $ = function (s) { return document.querySelector(s); };
var peer = null, conn = null, bekleyen = null;

function durum(t, cls) { var d = $("#durum"); d.textContent = t; d.className = cls || ""; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; }); }
function onizle() {
  var m = $("#metin").value.trim(), k = $("#kimden").value.trim();
  $("#sayac").textContent = $("#metin").value.length;
  $("#onizMetin").innerHTML = "<em>SON DAKİKA</em>" + (m ? esc(m) + (k ? " — " + esc(k) : "") : "Mesajın burada görünecek");
}
$("#metin").addEventListener("input", onizle);
$("#kimden").addEventListener("input", function () { try { localStorage.setItem("kimden", this.value); } catch (e) {} onizle(); });
try { $("#kimden").value = localStorage.getItem("kimden") || ""; } catch (e) {}
Array.prototype.forEach.call(document.querySelectorAll(".hazir button"), function (b) {
  b.addEventListener("click", function () { $("#metin").value = b.getAttribute("data-m"); onizle(); });
});
onizle();

if (!tvId) { durum("Bu sayfayı TV'deki QR kodu okutarak aç.", "hata"); $("#gonder").disabled = true; }

// TV'ye kalıcı bir veri bağlantısı aç; koparsa gönderirken yeniden açılır
function baglan() {
  return new Promise(function (coz, red) {
    if (conn && conn.open) return coz(conn);
    if (!peer || peer.destroyed || peer.disconnected) {
      try { peer && peer.destroy(); } catch (e) {}
      peer = new Peer();
    }
    var zaman = setTimeout(function () { red(new Error("TV bulunamadı. TV'de Onur TV açık mı?")); }, 12000);
    function ac() {
      conn = peer.connect(tvId, { reliable: true });
      conn.on("open", function () { clearTimeout(zaman); coz(conn); });
      conn.on("data", function (d) { if (d && d.tip === "alindi" && bekleyen) { bekleyen(d.ok); bekleyen = null; } });
      conn.on("error", function () {});
    }
    peer.on("error", function (e) {
      clearTimeout(zaman);
      red(new Error(e.type === "peer-unavailable" ? "TV bulunamadı. TV'de Onur TV açık mı?" : "Bağlantı hatası: " + e.type));
    });
    if (peer.open) ac(); else peer.on("open", ac);
  });
}

// Yayın zamanı seçimi
var gecikme = 0;
Array.prototype.forEach.call(document.querySelectorAll("#zaman button"), function (b) {
  b.addEventListener("click", function () {
    Array.prototype.forEach.call(document.querySelectorAll("#zaman button"), function (x) { x.classList.remove("secili"); });
    b.classList.add("secili");
    var ozel = b.getAttribute("data-sn") === "ozel";
    $("#ozel").classList.toggle("acik", ozel);
    gecikme = ozel ? (parseInt($("#ozelSn").value, 10) || 0) : parseInt(b.getAttribute("data-sn"), 10);
    $("#gonder").textContent = gecikme > 0 ? "⏱ " + sureYaz(gecikme) + " sonra yayınla" : "📺 TV'ye Gönder";
    if (ozel) $("#ozelSn").focus();
  });
});
$("#ozelSn").addEventListener("input", function () {
  gecikme = Math.max(0, parseInt(this.value, 10) || 0);
  $("#gonder").textContent = gecikme > 0 ? "⏱ " + sureYaz(gecikme) + " sonra yayınla" : "📺 TV'ye Gönder";
});
function sureYaz(sn) { return sn < 60 ? sn + " sn" : Math.floor(sn / 60) + " dk" + (sn % 60 ? " " + (sn % 60) + " sn" : ""); }
var sayacZaman = null;
function geriSay(sn, metin) {
  clearInterval(sayacZaman);
  var bitis = Date.now() + sn * 1000;
  (function tik() {
    var kalan = Math.ceil((bitis - Date.now()) / 1000);
    if (kalan <= 0) { clearInterval(sayacZaman); $("#geriSayim").textContent = "📺 \"" + metin.slice(0, 40) + (metin.length > 40 ? "…" : "") + "\" şu an bantta!"; return; }
    $("#geriSayim").textContent = "⏱ Yayına " + sureYaz(kalan) + " kaldı";
  })();
  sayacZaman = setInterval(function () {
    var kalan = Math.ceil((bitis - Date.now()) / 1000);
    if (kalan <= 0) { clearInterval(sayacZaman); $("#geriSayim").textContent = "📺 \"" + metin.slice(0, 40) + (metin.length > 40 ? "…" : "") + "\" şu an bantta!"; }
    else $("#geriSayim").textContent = "⏱ Yayına " + sureYaz(kalan) + " kaldı";
  }, 250);
}

$("#gonder").addEventListener("click", function () {
  var metin = $("#metin").value.trim();
  if (!metin) { durum("Önce bir mesaj yaz.", "hata"); $("#metin").focus(); return; }
  var btn = this; btn.disabled = true;
  durum("TV'ye gönderiliyor…");
  baglan().then(function (c) {
    var onay = new Promise(function (coz) { bekleyen = coz; setTimeout(function () { coz(null); }, 6000); });
    c.send({ tip: "mesaj", metin: metin, kimden: $("#kimden").value.trim(), gecikme: gecikme });
    return onay;
  }).then(function (ok) {
    if (ok === true) {
      if (gecikme > 0) { durum("✅ TV'ye ulaştı, " + sureYaz(gecikme) + " sonra yayınlanacak", "ok"); geriSay(gecikme, metin); }
      else { durum("✅ Gönderildi, şu an TV'nin alt bandında!", "ok"); $("#geriSayim").textContent = ""; }
      $("#metin").value = ""; onizle();
    } else {
      durum("TV mesajı onaylamadı, tekrar dene.", "hata");
    }
  }).catch(function (e) {
    conn = null;
    durum(e.message, "hata");
  }).then(function () { btn.disabled = false; });
});
</script>
</body>
</html>
